{{- if not .Values.existingSecret }}
{{- if or .Values.config.signingKey .Values.config.signingSalt .Values.config.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pixflow.fullname" . }}
  labels:
    {{- include "pixflow.labels" . | nindent 4 }}
  annotations:
    # Retain this Secret on helm uninstall so that credentials are not accidentally
    # wiped during a redeploy. Remove manually if you are rotating keys intentionally.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.config.signingKey }}
  {{ .Values.existingSecretKeys.signingKey }}: {{ .Values.config.signingKey | quote }}
  {{- end }}
  {{- if .Values.config.signingSalt }}
  {{ .Values.existingSecretKeys.signingSalt }}: {{ .Values.config.signingSalt | quote }}
  {{- end }}
  {{- if .Values.config.apiKey }}
  {{ .Values.existingSecretKeys.apiKey }}: {{ .Values.config.apiKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
