name: Publish

# Push to main  → RC chart release
#   Chart version: X.Y.Z-rc.<run_number>  (taken from Chart.yaml base + run number)
#   GitHub Release: marked as pre-release
#   OCI: ghcr.io/nuvlabs/charts/pixflow:X.Y.Z-rc.<run_number>
#
# Push a v* tag → Stable chart release
#   Chart version: X.Y.Z  (plain semver from Chart.yaml)
#   GitHub Release: marked as latest
#   OCI: ghcr.io/nuvlabs/charts/pixflow:X.Y.Z
#
# Workflow automatically derives the version — keep Chart.yaml at plain X.Y.Z
# (e.g. 0.1.0). The RC suffix is injected at publish time; no manual bumping
# of Chart.yaml is needed for RC builds.
on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/publish.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — lint and package only, do not publish"
        required: false
        default: "false"
        type: boolean

env:
  OCI_REGISTRY: ghcr.io/nuvlabs/charts

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Lint — validate all charts before attempting to publish.
  # This job is the gate; release and oci only run when it succeeds.
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Set up Python (required by chart-testing)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run helm lint on all charts
        run: |
          for chart in charts/*/; do
            echo "──── Linting $chart ────"
            helm lint "$chart" --strict
          done

      - name: Render templates (smoke-test with default values)
        run: |
          for chart in charts/*/; do
            name=$(basename "$chart")
            echo "──── Rendering $name ────"
            helm template "smoke-$name" "$chart" \
              --set config.skipVerify=true \
              --debug \
              --dry-run 2>&1 | tail -5
          done

  # ──────────────────────────────────────────────────────────────────────────
  # Release — publish to GitHub Pages Helm repository via chart-releaser.
  #
  # Version strategy:
  #   main push → X.Y.Z-rc.<run_number>   (pre-release, --devel needed to install)
  #   tag push  → X.Y.Z                   (stable, default helm search/install)
  #
  # Chart.yaml always holds the plain X.Y.Z base; the RC suffix is injected
  # into a working copy of Chart.yaml before cr runs so the repo always stays
  # clean.
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: ${{ startsWith(github.ref, 'refs/tags/v') && 'Release (stable)' || 'Release (RC)' }}
    needs: lint
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name  "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Compute chart version
        id: ver
        run: |
          base=$(grep '^version:' charts/pixflow/Chart.yaml | awk '{print $2}' | sed 's/-.*//')
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            version="${base}-rc.${{ github.run_number }}"
          else
            version="${base}"
          fi
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "Chart version: ${version}"

      - name: Stamp version into Chart.yaml
        run: |
          for chart in charts/*/; do
            sed -i "s/^version: .*/version: ${{ steps.ver.outputs.version }}/" "${chart}Chart.yaml"
            echo "$(basename $chart) → ${{ steps.ver.outputs.version }}"
          done

      - name: Bootstrap gh-pages branch
        # chart-releaser requires the gh-pages branch to exist before its first
        # run. Create it as an empty orphan branch if it is absent so the action
        # succeeds on the very first push to main.
        run: |
          git fetch origin gh-pages 2>/dev/null && echo "gh-pages exists" && exit 0
          git checkout --orphan gh-pages
          git rm -rf . > /dev/null
          echo "apiVersion: v1" > index.yaml
          echo "entries: {}" >> index.yaml
          git add index.yaml
          git commit -m "chore: initialise Helm repository index"
          git push origin gh-pages
          git checkout -

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          charts_dir: charts
          # Stable tag push → mark as latest. RC main push → pre-release
          # (chart-releaser sets pre-release automatically for versions with a
          # pre-release suffix like -rc.N).
          mark_as_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Summary
        if: always()
        run: |
          echo "## Helm Repository — ${{ steps.ver.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm repo add nuvlabs https://nuvlabs.github.io/helm-charts" >> $GITHUB_STEP_SUMMARY
          echo "helm repo update" >> $GITHUB_STEP_SUMMARY
          echo "# Stable" >> $GITHUB_STEP_SUMMARY
          echo "helm install pixflow nuvlabs/pixflow --version ${{ steps.ver.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "# RC" >> $GITHUB_STEP_SUMMARY
          echo "helm install pixflow nuvlabs/pixflow --version ${{ steps.ver.outputs.version }} --devel" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────
  # OCI — push charts to GHCR as OCI artifacts (alternative install method).
  #
  # Uses the same version strategy as the release job: RC suffix injected via
  # `helm package --version` so Chart.yaml stays at plain X.Y.Z.
  #
  # Users install with:
  #   helm install pixflow oci://ghcr.io/nuvlabs/charts/pixflow --version 0.1.0-rc.5
  # ──────────────────────────────────────────────────────────────────────────
  oci:
    name: Push to OCI Registry (GHCR)
    needs: lint
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Compute chart version
        id: ver
        run: |
          base=$(grep '^version:' charts/pixflow/Chart.yaml | awk '{print $2}' | sed 's/-.*//')
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            version="${base}-rc.${{ github.run_number }}"
          else
            version="${base}"
          fi
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "Chart version: ${version}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push all charts
        run: |
          mkdir -p /tmp/helm-packages
          version="${{ steps.ver.outputs.version }}"
          for chart in charts/*/; do
            name=$(basename "$chart")
            echo "──── Packaging $name@${version} ────"
            helm package "$chart" --version "${version}" -d /tmp/helm-packages
            pkg="/tmp/helm-packages/${name}-${version}.tgz"
            echo "Pushing → oci://${{ env.OCI_REGISTRY }}"
            helm push "$pkg" "oci://${{ env.OCI_REGISTRY }}"
            echo "✓ $name@${version} pushed"
          done

      - name: Summary
        if: always()
        run: |
          version="${{ steps.ver.outputs.version }}"
          echo "## OCI Registry — ${version}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for chart in charts/*/; do
            name=$(basename "$chart")
            echo "### \`${name}@${version}\`" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "helm install ${name} oci://ghcr.io/nuvlabs/charts/${name} --version ${version}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
